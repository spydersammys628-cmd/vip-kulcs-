<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferike Modz - VIP Kulcs Rendszer</title>
    <style>
        body { background: #0c0a1d; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 380px; margin: 20px auto; background: #161230; border: 2px solid #00ffcc; padding: 20px; border-radius: 12px; box-shadow: 0 0 20px rgba(0,255,204,0.3); }
        h2 { color: #00ffcc; margin-bottom: 5px; }
        .subtitle { font-size: 12px; color: #aaa; margin-bottom: 15px; }
        .box { background: #080511; border: 1px solid #ff007f; padding: 12px; border-radius: 8px; margin: 15px 0; }
        .key { font-size: 15px; font-weight: bold; color: #ff007f; word-break: break-all; }
        button { background: linear-gradient(135deg, #ff007f, #00ffcc); color: #fff; border: none; padding: 12px; width: 100%; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 14px; margin-top: 10px; }
        button.secondary { background: linear-gradient(135deg, #444, #777); }
        button.admin-btn { background: linear-gradient(135deg, #ffaa00, #ff4400); font-size: 12px; padding: 8px; margin-top: 15px; }
        .info { font-size: 13px; color: #ddd; margin-top: 10px; text-align: left; line-height: 1.4; }
        .badge { background: #ff007f; color: white; padding: 3px 8px; font-size: 10px; border-radius: 4px; font-weight: bold; }
        input { width: 90%; padding: 10px; margin: 8px 0; background: #080511; border: 1px solid #00ffcc; color: #fff; border-radius: 6px; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <h2>FERIKE VIP PANEL</h2>
        <div class="subtitle">Biztonságos Licensz & Kulcsgenerátor</div>

        <!-- Napi Ingyenes Kulcs -->
        <div class="box">
            <span class="badge">INGYENES 1 NAPOS KULCS</span>
            <p style="font-size: 12px; color: #ccc; margin: 8px 0;">A mai napra érvényes kulcs:</p>
            <div class="key" id="daily-key">Generálás...</div>
            <button onclick="copyKey('daily-key')">NAPI KULCS MÁSOLÁSA</button>
        </div>

        <!-- Többnapos / VIP Vásárlás -->
        <div class="box" style="border-color: #00ffcc;">
            <span class="badge" style="background: #00ffcc; color: #000;">VIP CSOMAGOK</span>
            <p style="font-size: 12px; color: #ccc; margin: 8px 0;">Hosszú távú kulcs igénylése:</p>
            <button onclick="openVipShop()" class="secondary">7 / 30 NAPOS VIP</button>
        </div>

        <button onclick="openFreeFire()" style="background: linear-gradient(135deg, #ff512f, #f09819);">FREE FIRE INDÍTÁSA</button>

        <!-- Admin Bejelentkezés Szekció -->
        <button onclick="toggleAdminPanel()" class="admin-btn">👑 ADMIN BELÉPÉS</button>

        <div id="admin-section" style="display:none; margin-top: 15px; border-top: 1px dashed #444; padding-top: 10px;">
            <p style="font-size: 11px; color: #ffaa00;">Adminisztrátori 1 Éves Kulcsgeneráló</p>
            <input type="text" id="admin-user" placeholder="Admin név (pl. Ferike)">
            <input type="password" id="admin-pass" placeholder="Admin jelszó">
            <button onclick="generateAdminKey()" style="background: #ffaa00; color: #000;">1 ÉVES KULCS GENERÁLÁSA</button>
            <div class="key" id="admin-key-result" style="margin-top: 10px; font-size: 13px;"></div>
        </div>

        <div class="info">
            <b>Infó:</b>
            <ul>
                <li>Az ingyenes kulcs 24 óráig él.</li>
                <li>Az adminok 1 éves teljes hozzáférést kapnak.</li>
            </ul>
        </div>
    </div>

    <script>
        // Itt állíthatod be az adminokat és a jelszavaikat:
        const admins = {
            "Ferike": "admin123",
            "Szefdj": "sammy2026"
        };

        function generateDailyKey() {
            const date = new Date();
            const day = date.getDate();
            const month = date.getMonth() + 1;
            const year = date.getFullYear();
            const hash = (day * 33 + month * 12 + year) * 7;
            return `FERIKE-VIP-40HS-${hash}`;
        }

        document.getElementById('daily-key').innerText = generateDailyKey();

        function copyKey(elementId) {
            const text = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(text);
            alert("Kulcs a vágólapra másolva!");
        }

        function openVipShop() {
            window.location.href = "https://spydersammys628-cmd.github.io/vip-kulcs/shop.html"; 
        }

        function openFreeFire() {
            window.location.href = "com.dts.freefireth://";
        }

        function toggleAdminPanel() {
            const panel = document.getElementById('admin-section');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        function generateAdminKey() {
            const user = document.getElementById('admin-user').value.trim();
            const pass = document.getElementById('admin-pass').value.trim();

            if (admins[user] && admins[user] === pass) {
                const adminKey = `FERIKE-ADMIN-1YEAR-${user.toUpperCase()}-2026-OK`;
                document.getElementById('admin-key-result').innerText = adminKey;
                alert("Sikeres admin azonosítás! 1 éves kulcs generálva.");
            } else {
                alert("Hibás admin név vagy jelszó!");
                document.getElementById('admin-key-result').innerText = "";
            }
        }
    </script>
</body>
</html>
